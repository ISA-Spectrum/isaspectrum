<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>审核员登录 · ISA Spectrum</title>
  <link rel="icon" type="image/svg+xml" href="./images/favicon.svg">
  <style>
    *{box-sizing:border-box}body{display:grid;min-height:100vh;margin:0;padding:24px;place-items:center;background:#f4f6fb;color:#171c2c;font:16px/1.6 system-ui,sans-serif}.card{width:min(440px,100%);padding:36px;border:1px solid #dfe4ee;border-radius:22px;background:#fff;box-shadow:0 18px 55px rgba(16,35,126,.11)}h1{margin:0 0 10px}.button{display:flex;min-height:48px;margin-top:24px;align-items:center;justify-content:center;border-radius:13px;color:#fff;background:#2146f3;text-decoration:none;font-weight:800}.back{display:block;margin-top:16px;color:#2146f3;text-align:center;text-decoration:none}.error{margin-top:18px;padding:12px;border-radius:10px;background:#fff0f3;color:#a51d3c}
  </style>
</head>
<body><main class="card">
  <h1>审核员登录</h1>
  <p>使用统一账号登录后，本站只检查该业务账号是否具有审核员权限，不要求绑定身份验证器。</p>
  <p class="error" id="error" hidden></p>
  <a class="button" href="/auth/login?return_to=%2Fchecker-pending.html">通过统一认证进入</a>
  <a class="back" href="main.html">返回首页</a>
</main><script>
  const messages={forbidden:'当前业务账号没有审核权限。',access_denied:'你已取消认证。',invalid_request:'认证请求无效，请重新开始。',invalid_grant:'认证凭据已过期或已使用，请重新认证。',login_required:'认证中心要求重新登录。',interaction_required:'认证中心需要你完成额外验证。',state_mismatch:'认证请求已失效，请重新开始。',nonce_mismatch:'身份校验未通过，请重新认证。',token_endpoint_failure:'认证中心暂时无法完成登录。',authorization_server_unavailable:'认证中心暂时不可用，请稍后重试。',invalid_id_token:'身份令牌校验失败，请重新认证。',configuration_error:'审核登录尚未完成配置。',authentication_failed:'认证失败，请重新尝试。',id_token_algorithm_mismatch:'认证中心的签名算法不在本站允许列表内（请检查 OIDC_ALLOWED_ALGORITHMS）。',id_token_key_unavailable:'无法用认证中心公布的公钥验证身份令牌，可能是密钥刚轮换，请重新认证。',id_token_signature_invalid:'身份令牌签名校验失败，请重新认证。',id_token_issuer_mismatch:'身份令牌的签发者与本站配置不一致（请检查 AUTH_ISSUER）。',id_token_audience_mismatch:'身份令牌的受众不是本站客户端，需要在认证中心为该客户端配置 Audience mapper。',id_token_expired:'身份令牌已过期，请重新认证。',id_token_clock_skew:'本站与认证中心的时间不同步，请检查服务器时钟。',id_token_invalid:'身份令牌校验失败，请重新认证。',identity_mismatch:'认证中心返回的用户身份不一致，请重新认证。',business_store_unavailable:'业务数据库暂时不可用，请稍后重试。',business_store_permission_denied:'业务数据库拒绝了本次写入（权限不足，通常是缺少列级权限）。',business_store_key_rejected:'业务数据库不接受本站令牌（签名密钥不匹配）。',client_authentication_failed:'认证中心拒绝了本站的客户端身份，请检查 AUTH_CLIENT_SECRET 是否已按 Secret 类型配置且未过期。'};
  const message=messages[new URLSearchParams(location.search).get('error')];
  if(message){const box=document.getElementById('error');box.textContent=message;box.hidden=false}
</script></body>
</html>
