<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>审核员登录 · ISA Spectrum</title>
  <link rel="icon" type="image/svg+xml" href="./images/favicon.svg">
  <style>
    *{box-sizing:border-box}body{display:grid;min-height:100vh;margin:0;padding:24px;place-items:center;background:#f4f6fb;color:#171c2c;font:16px/1.6 system-ui,sans-serif}.card{width:min(440px,100%);padding:36px;border:1px solid #dfe4ee;border-radius:22px;background:#fff;box-shadow:0 18px 55px rgba(16,35,126,.11)}h1{margin:0 0 10px}.button{display:flex;min-height:48px;margin-top:24px;align-items:center;justify-content:center;border-radius:13px;color:#fff;background:#2146f3;text-decoration:none;font-weight:800}.back{display:block;margin-top:16px;color:#2146f3;text-align:center;text-decoration:none}.error{margin-top:18px;padding:12px;border-radius:10px;background:#fff0f3;color:#a51d3c}
  </style>
</head>
<body><main class="card">
  <h1>审核员登录</h1>
  <p>使用统一账号登录后，本站只检查该业务账号是否具有审核员权限，不要求绑定身份验证器。</p>
  <p class="error" id="error" hidden></p>
  <a class="button" href="/auth/login?return_to=%2Fchecker-pending.html">通过统一认证进入</a>
  <a class="back" href="main.html">返回首页</a>
</main><script>
  const messages={forbidden:'当前业务账号没有审核权限。',access_denied:'你已取消认证。',invalid_request:'认证请求无效，请重新开始。',invalid_grant:'认证凭据已过期或已使用，请重新认证。',login_required:'认证中心要求重新登录。',interaction_required:'认证中心需要你完成额外验证。',state_mismatch:'认证请求已失效，请重新开始。',nonce_mismatch:'身份校验未通过，请重新认证。',token_endpoint_failure:'认证中心暂时无法完成登录。',authorization_server_unavailable:'认证中心暂时不可用，请稍后重试。',invalid_id_token:'身份令牌校验失败，请重新认证。',configuration_error:'审核登录尚未完成配置。',authentication_failed:'认证失败，请重新尝试。'};
  const message=messages[new URLSearchParams(location.search).get('error')];
  if(message){const box=document.getElementById('error');box.textContent=message;box.hidden=false}
</script></body>
</html>
