<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册账号 - ISA Spectrum</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4/dist/umd/supabase.min.js"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: #f0f2f5; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .login-box { background: #fff; padding: 40px 30px; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); width: 100%; max-width: 400px; }
        .login-box h2 { text-align: center; margin-bottom: 8px; color: #1e50ae; font-size: 24px; }
        .login-box .sub { text-align: center; color: #888; font-size: 14px; margin-bottom: 30px; }
        .login-box input { width: 100%; padding: 14px 16px; margin-bottom: 8px; border: 1px solid #ddd; border-radius: 10px; font-size: 15px; transition: border-color 0.2s; }
        .login-box input:focus { outline: none; border-color: #1e50ae; }
        .login-btn { width: 100%; padding: 14px; background: #1e50ae; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .login-btn:hover { background: #15408f; }
        .login-btn:disabled { background: #999; cursor: not-allowed; }
        .back-link { display: block; text-align: center; margin-top: 10px; color: #1e50ae; text-decoration: none; font-size: 14px; }
        .error-msg { color: #dc3545; text-align: center; font-size: 13px; margin-top: 8px; display: none; }
        .input-error { border-color: #dc3545 !important; }
        .tip-text { font-size: 12px; color: #666; margin: 0 0 14px 4px; }
        .cf-turnstile { margin: 10px 0 16px 0; }
        #accountTips { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:flex; justify-content:center; align-items:center; z-index:999; }
        .tipsContent { background:white; padding:25px; border-radius:16px; max-width:320px; text-align:center; box-shadow:0 4px 24px rgba(0,0,0,0.12); }
        .closeTips { margin-top:15px; padding:8px 20px; background:#1e50ae; color:white; border:none; border-radius:10px; cursor:pointer; font-weight:600; }
        .closeTips:hover { background:#15408f; }
    </style>
    <link rel="icon" type="image/png" href="/images/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <link rel="shortcut icon" href="/images/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ISA Spectrum" />
    <link rel="manifest" href="/images/site.webmanifest" />
</head>
<body>
    <div id="accountTips">
        <div class="tipsContent">
            <p>注册后会发送验证邮件，请前往邮箱激活后再登录！请尽量使用能代表个人的用户名（请勿使用代表他人的用户名或直接使用他人姓名作为用户名，以上行为一经发现封号处理）</p>
            <button class="closeTips" onclick="closeTips()">我知道了</button>
        </div>
    </div>

    <div class="login-box">
        <h2>账号注册</h2>
        <p class="sub">创建您的 ISA Spectrum 账号</p>
        <input id="username" placeholder="设置用户名" type="text">
        <input id="email" placeholder="邮箱" type="email">
        <input id="password" placeholder="设置密码" type="password">
        <p class="tip-text">密码规则：至少8位，需同时包含字母和数字</p>

        <!-- 把原来的 <div class="cf-turnstile"> 替换成下面这段 -->
<div class="cf-turnstile" data-sitekey="0x4AAAAAADiuoBfqizSwVz3U" data-callback="onTurnstileSuccess"></div>

<script>
// 监听 Turnstile 验证成功事件
function onTurnstileSuccess(token) {
    // 验证成功后，才启用登录按钮
    document.getElementById('loginBtn').disabled = false;
}

// 页面加载完成后初始化 Turnstile
window.onload = function() {
    // 初始状态下禁用登录按钮，防止用户未验证就点击
    document.getElementById('loginBtn').disabled = true;
};
</script>

        <button class="login-btn" id="registerBtn" disabled>完成注册</button>
        <p class="error-msg" id="errorMsg"></p>
        <a href="login.html" class="back-link">返回登录</a>
        <a href="main.html" class="back-link">返回首页</a>
    </div>

    <script>
        const SUPABASE_URL = 'https://bbcnrsktqarvceekrswb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_f3Kav8ipJco_f9tw5zO50A_w7KigE5D';
        
        if (!window.supabase) {
            alert('Supabase 加载失败，请检查网络！');
        }
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.onload = () => document.getElementById('accountTips').style.display = 'flex';
        function closeTips() { document.getElementById('accountTips').style.display = 'none'; }

        // 密码校验规则：8位以上 + 同时含字母、数字
        function checkPwdRule(pwd) {
            const regNum = /\d/;
            const regLetter = /[a-zA-Z]/;
            return pwd.length >= 8 && regNum.test(pwd) && regLetter.test(pwd);
        }

        const usernameInp = document.getElementById('username');
        const emailInp = document.getElementById('email');
        const pwdInp = document.getElementById('password');
        const regBtn = document.getElementById('registerBtn');
        const errorMsg = document.getElementById('errorMsg');

        // 实时校验
        function validateForm() {
            const un = usernameInp.value.trim();
            const em = emailInp.value.trim();
            const pwd = pwdInp.value;

            let allValid = true;
            // 清空错误样式
            usernameInp.classList.remove('input-error');
            emailInp.classList.remove('input-error');
            pwdInp.classList.remove('input-error');

            if(!un) { usernameInp.classList.add('input-error'); allValid = false; }
            if(!em) { emailInp.classList.add('input-error'); allValid = false; }
            if(!checkPwdRule(pwd)) { pwdInp.classList.add('input-error'); allValid = false; }

            regBtn.disabled = !allValid;
        }

        usernameInp.addEventListener('input', validateForm);
        emailInp.addEventListener('input', validateForm);
        pwdInp.addEventListener('input', validateForm);

        window.doRegister = async function() {
            const username = usernameInp.value.trim();
            const email = emailInp.value.trim();
            const password = pwdInp.value;
            const btn = regBtn;
            
            errorMsg.style.display = 'none';

            btn.disabled = true;
            btn.textContent = '注册中...';

            try {
                const { error } = await supabase.auth.signUp({
                    email, password,
                    options: { data: { username } }
                });
                
                if (error) throw error;
                
                alert('注册成功！请前往邮箱查收验证邮件，激活后登录。');
                location.href = 'login.html';
            } catch (err) {
                errorMsg.textContent = '注册失败：' + err.message;
                errorMsg.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = '完成注册';
            }
        };

        document.getElementById('registerBtn').addEventListener('click', window.doRegister);
        document.addEventListener('keydown', e => e.key === 'Enter' && window.doRegister());
    </script>
</body>
</html>
