  <style>
    * { box-sizing: border-box; }

    main { width: min(100%, 44rem); padding: clamp(24px, 7vw, 64px); border: 1px solid #353935; border-radius: 24px; background: #171717; }
    h1 { margin: 0 0 24px; font-size: clamp(2rem, 6vw, 3.7rem); line-height: 1.14; }
    p { color: #bec4be; line-height: 1.8; }
    .entry { margin: 24px 0 0; padding-top: 16px; border-top: 1px solid #353935; }
    .entry a { color: #bec4be; text-underline-offset: 4px; }
    .entry a:hover { color: #5cff8a; }
    .signature { margin: 28px 0 0; text-align: right; }
    a:focus-visible { outline: 3px solid white; outline-offset: 5px; }
  </style>

  <main>

    <p class="signature">RootedVox团队</p>
