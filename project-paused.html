  <style>
    :root {
      --blue: #1e3a8a;
      --dark: #0d1117;
      --green: #33ff66;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #ffffff;
      color: var(--blue);
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      /* 背景色和文字颜色的过渡 */
      transition: background-color 2.5s ease, color 1.5s ease;
    }

    main {
      width: min(100%, 42rem);
      display: grid;
    }

    .opening, .closing {
      grid-area: 1 / 1;
      align-self: center;
    }

    .logo {
      position: relative;
      width: 110px;
      aspect-ratio: 192 / 230;
      margin: 0 auto 16px;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .logo img {
      display: block;
      width: 100%;
      filter: url(#logo-matte);
    }

    .status {
      margin: 0;
      font-size: clamp(1.25rem, 4.5vw, 2rem);
      line-height: 1.45;
      transition: opacity 0.5s ease, transform 0.8s ease;
    }

    .closing {
      display: grid;
      gap: 1rem;
      visibility: hidden;
    }

    .closing .status {
      min-height: 3em;
      display: grid;
      align-items: end;
    }

    .line, .timer, .entry {
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .line {
      margin: 0;
      line-height: 1.75;
      font-size: 1.05rem;
    }

    .green {
      color: var(--green);
      text-shadow: 0 0 14px #33ff6650;
    }

    .timer {
      font: 700 clamp(3.5rem, 16vw, 7rem) / 1 monospace;
      margin: .25rem 0;
    }

    .cursor {
      display: inline-block;
      margin-left: .12em;
      font-size: .6em;
    }

    .cursor.blink { animation: blink .85s steps(1) both; }

    @keyframes blink {
      0%, 45%, 85% { opacity: 1; }
      20%, 65% { opacity: 0; }
    }

    .entry {
      color: var(--green);
      text-underline-offset: .25em;
      visibility: hidden;
      font-size: 1.1rem;
    }

    /* 阶段状态类 */
    .retry, .story, .second {
      background: #000000;
      color: #ffffff;
    }

    .final {
      background: var(--dark);
      color: #ffffff;
      transition-duration: .35s;
    }

    :is(.story, .second, .final) .logo {
      opacity: 0;
      transform: translateY(-20px);
    }

    .opening {
      transition: opacity .6s ease, transform .8s ease, visibility .6s;
    }

    :is(.story, .second, .final) .opening {
      opacity: 0;
      transform: translateY(-40px);
      visibility: hidden;
    }

    :is(.story, .second, .final) .closing {
      visibility: visible;
    }

    .closing .status {
      opacity: 0;
      transform: translateY(32px);
    }

    :is(.story, .second, .final) .closing .status:not(.changing),
    :is(.story, .second, .final) .first,
    :is(.second, .final) .last,
    .final :is(.timer, .entry) {
      opacity: 1;
      transform: translateY(0);
    }

    .final .entry {
      visibility: visible;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::after { transition: none !important; animation: none !important; }
    }
  </style>

  <script>
    const openingStatus = document.querySelector('#opening-status');
    const status = document.querySelector('#status');
    const count = document.querySelector('#count');
    const cursor = document.querySelector('#cursor');
    const wait = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));

    async function playShutdown() {
      // 1. 初始状态停留（让你看清原本的 Logo）
      await wait(2000);

      // 2. 变黑，文字切换为重连
      openingStatus.textContent = status.textContent;
      document.body.className = 'retry';

      // 3. 留一点时间让变黑的动画和文字变化被看清，然后屏幕变全黑
      await wait(1800);
      document.body.className = 'story';

      // 4. 第一句话停留时间（给用户阅读时间）
      await wait(6000);

      // 5. 切换到第二句话 (2/2)
      status.classList.add('changing');
      await wait(400);
      status.textContent = '连接失败，正在重试 (2/2)……';
      status.classList.remove('changing');
      document.body.className = 'second';

      // 6. 第二句话停留时间
      await wait(4500);

      // 7. 出现最终的跳转警告
      status.classList.add('changing');
      await wait(400);
      status.textContent = 'ISA Spectrum 已断开连接。3秒后，将为您自动跳转至真正的自由之声 —— RootedVox';
      status.classList.remove('changing');
      document.body.className = 'final';

      // 8. 倒计时开始
      for (let seconds = 3; seconds > 0; seconds--) {
        count.textContent = seconds;
        cursor.classList.remove('blink');
        void cursor.offsetWidth;
        cursor.classList.add('blink');
        await wait(1000); // 每秒钟跳一次
      }

      // 9. 跳转
      window.location.href = "https://rv.celestivast.com";
    }

    playShutdown();
  </script>
</body>
