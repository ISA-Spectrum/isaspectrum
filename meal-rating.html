<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="ISA Spectrum 每日餐食评分：评价早餐、午餐和晚餐。">
  <title>每日餐食评分 · ISA Spectrum</title>
  <link rel="stylesheet" href="./common.css">
  <link rel="icon" type="image/svg+xml" href="./images/favicon.svg">
  <script src="./auth-client.js" defer></script>
  <script src="./meal-rating.js" defer></script>
  <style>
    .rating-shell{width:min(1040px,calc(100% - 40px));margin:auto;padding:112px 0 20px}.rating-top{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:24px}.rating-kicker{margin:0 0 6px;color:var(--theme-color);font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.rating-top h1{margin:0;color:var(--ink);font-size:clamp(38px,6vw,64px);line-height:1;letter-spacing:-.055em}.rating-top p{max-width:500px;margin:12px 0 0;color:var(--muted)}.back-link{color:var(--theme-color);font-size:14px;font-weight:750;text-decoration:none;white-space:nowrap}.back-link:hover{text-decoration:underline;text-underline-offset:4px}.account-notice{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px;padding:16px 18px;border:1px solid #cbd4ff;border-radius:16px;color:#263359;background:var(--theme-soft)}.account-notice strong{display:block;color:var(--theme-color);font-size:14px}.account-notice span{font-size:13px}.rating-date{color:#68728b;font-size:13px;white-space:nowrap}.rating-form{padding:28px;border:1px solid var(--line);border-radius:26px;background:#fff;box-shadow:var(--shadow-sm);transition:opacity .2s}.rating-shell[data-ready="false"] .rating-form{pointer-events:none;opacity:.48}.score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.score-card{min-width:0;margin:0;padding:20px;border:1px solid var(--line);border-radius:20px;background:#fbfcff}.score-card legend{display:block;width:100%;padding:0;color:var(--ink);font-size:18px;font-weight:800}.score-card legend small{display:block;margin-top:2px;color:var(--muted);font-size:12px;font-weight:550}.score-options{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:18px}.score-button{display:grid;min-width:0;height:42px;padding:0;place-items:center;border:1px solid #d9deea;border-radius:10px;color:#5e6678;background:#fff;cursor:pointer;font-size:14px;font-weight:800;transition:.18s}.score-button:hover{border-color:#8799fa;color:var(--theme-color)}.score-button.selected{border-color:var(--theme-color);color:#fff;background:var(--theme-color);box-shadow:0 6px 14px rgba(33,70,243,.2)}.score-description{min-height:20px;margin:10px 0 0;color:var(--muted);text-align:center;font-size:13px}.rating-scale{display:flex;justify-content:space-between;margin:18px 2px 0;color:#929aad;font-size:12px}.comment-field{margin-top:22px}.comment-field label{display:flex;justify-content:space-between;margin-bottom:9px;color:var(--ink);font-size:15px;font-weight:750}.comment-field label span{color:var(--muted);font-size:12px;font-weight:500}.comment-field textarea{width:100%;min-height:120px;padding:14px;border:1px solid var(--line);border-radius:15px;color:var(--ink);background:#fbfcff;resize:vertical;font-size:16px;line-height:1.6}.comment-field textarea:focus{outline:0;border-color:var(--theme-color);box-shadow:0 0 0 4px rgba(33,70,243,.1)}.submit-row{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:18px}.rating-status{margin:0;color:var(--muted);font-size:13px}.rating-status.success{color:#08783f}.rating-status.error{color:#b42318}.rating-submit{min-width:166px;min-height:48px;padding:0 22px;border:0;border-radius:13px;color:#fff;background:var(--theme-color);cursor:pointer;font-weight:800}.rating-submit:disabled{cursor:not-allowed;opacity:.55}@media(max-width:760px){.rating-shell{width:min(100% - 28px,1040px);padding-top:92px}.rating-top{display:block}.back-link{display:inline-block;margin-top:14px}.account-notice{align-items:flex-start;flex-direction:column}.score-grid{grid-template-columns:1fr}.rating-form{padding:20px}.submit-row{align-items:stretch;flex-direction:column}.rating-submit{width:100%}}
  </style>
</head>
<body>
  <div id="headerBox"></div>
  <main class="rating-shell" id="ratingShell" data-ready="false">
    <div class="rating-top"><div><p class="rating-kicker">Daily meal check</p><h1>今日餐食评分</h1><p>请分别评价今天的早餐、午餐和晚餐。当天可以回来修改已经提交的内容。</p></div><a class="back-link" href="main.html">← 返回首页</a></div>
    <div class="account-notice"><div><strong>反馈与账号绑定</strong><span id="ratingIdentity">正在确认登录状态…</span></div><time class="rating-date" id="ratingDate"></time></div>
    <form class="rating-form" id="ratingForm" novalidate>
      <div class="score-grid">
        <fieldset class="score-card" data-meal="breakfast"><legend>早餐<small>Breakfast</small></legend><div class="score-options" role="group" aria-label="早餐评分"><button class="score-button" type="button" data-score="1" aria-pressed="false">1</button><button class="score-button" type="button" data-score="2" aria-pressed="false">2</button><button class="score-button" type="button" data-score="3" aria-pressed="false">3</button><button class="score-button" type="button" data-score="4" aria-pressed="false">4</button><button class="score-button" type="button" data-score="5" aria-pressed="false">5</button></div><p class="score-description">请选择 1–5 分</p></fieldset>
        <fieldset class="score-card" data-meal="lunch"><legend>午餐<small>Lunch</small></legend><div class="score-options" role="group" aria-label="午餐评分"><button class="score-button" type="button" data-score="1" aria-pressed="false">1</button><button class="score-button" type="button" data-score="2" aria-pressed="false">2</button><button class="score-button" type="button" data-score="3" aria-pressed="false">3</button><button class="score-button" type="button" data-score="4" aria-pressed="false">4</button><button class="score-button" type="button" data-score="5" aria-pressed="false">5</button></div><p class="score-description">请选择 1–5 分</p></fieldset>
        <fieldset class="score-card" data-meal="dinner"><legend>晚餐<small>Dinner</small></legend><div class="score-options" role="group" aria-label="晚餐评分"><button class="score-button" type="button" data-score="1" aria-pressed="false">1</button><button class="score-button" type="button" data-score="2" aria-pressed="false">2</button><button class="score-button" type="button" data-score="3" aria-pressed="false">3</button><button class="score-button" type="button" data-score="4" aria-pressed="false">4</button><button class="score-button" type="button" data-score="5" aria-pressed="false">5</button></div><p class="score-description">请选择 1–5 分</p></fieldset>
      </div>
      <div class="rating-scale"><span>1 · 很不满意</span><span>5 · 非常满意</span></div>
      <div class="comment-field"><label for="ratingComment">补充意见 <span id="ratingCommentCount">0 / 500</span></label><textarea id="ratingComment" maxlength="500" placeholder="哪道菜好吃？口味、温度或选择上有什么建议？"></textarea></div>
      <div class="submit-row"><p class="rating-status" id="ratingStatus" role="status" aria-live="polite">正在加载今日评分…</p><button class="rating-submit" id="ratingSubmit" type="submit" disabled>提交今日评分</button></div>
    </form>
  </main>
  <div id="footerBox"></div>
  <script src="./common.js"></script>
</body>
</html>
