<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>绑定两步验证 · ISA Spectrum</title>
  <link rel="stylesheet" href="./mfa.css"><link rel="icon" type="image/svg+xml" href="./images/favicon.svg">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4/dist/umd/supabase.min.js"></script><script src="./auth-mfa.js"></script>
</head>
<body><main class="auth-card">
  <a class="brand" href="main.html"><img src="./images/logo.png" alt=""><span><strong>ISA Spectrum</strong><small>Account security</small></span></a>
  <p class="eyebrow">Authenticator setup</p><h1>绑定身份验证器</h1><p id="intro">使用 Microsoft Authenticator、Google Authenticator 或其他兼容应用扫描二维码。</p>
  <div class="notice" id="requiredNotice" hidden><strong>审核员必须开启两步验证。</strong> 完成绑定后才能进入审核后台。</div>
  <button class="button" id="startButton" type="button">生成绑定二维码</button>
  <section id="enrollPanel" hidden><div class="qr-wrap"><img id="qrCode" alt="身份验证器绑定二维码"><div class="secret" id="secret"></div></div><form id="setupForm" novalidate><label class="field" for="code"><span>输入应用中显示的 6 位数字</span><input class="code-input" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></label><button class="button" id="confirmButton" type="submit">确认绑定</button></form></section>
  <p class="status" id="status" role="status" aria-live="polite"></p><div class="links"><a id="backLink" href="security.html">返回账号安全</a></div>
</main><script>
  const client=window.supabase.createClient('https://bbcnrsktqarvceekrswb.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJiYmNyc2t0cWFydmNlZWtyc3diIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MjUxODYsImV4cCI6MjA5NTEwMTE4Nn0.Mu6GW91z1HW2iX-tbQgH5qXrvpG2SPc9QoqCxGvV-54');
  const params=new URLSearchParams(location.search);const checker=params.get('checker')==='1';const required=params.get('required')==='1';const returnTo=ISAMFA.safeReturnTo(params.get('returnTo'),checker?'checker-pending.html':'security.html');let pendingFactor=null;
  const statusEl=document.getElementById('status');const show=(message,type='')=>{statusEl.textContent=message;statusEl.className='status '+type};
  if(required){document.getElementById('requiredNotice').hidden=false;document.getElementById('backLink').hidden=true}
  (async()=>{try{const auth=await ISAMFA.requireSession(client,{returnTo,checker});if(!auth)return;const factors=await ISAMFA.verifiedTotpFactors(client);if(required&&factors.length){location.replace(ISAMFA.pageUrl('mfa-challenge.html',{returnTo,checker:checker?'1':''}))}}catch(error){show('无法读取账号状态：'+error.message,'error')}})();
  document.getElementById('startButton').addEventListener('click',async function(){this.disabled=true;this.textContent='正在生成…';show('');try{const data=await ISAMFA.getProvider().enroll(client,'ISA Spectrum 验证器 '+new Date().toLocaleDateString('zh-CN'));pendingFactor=data;document.getElementById('qrCode').src=data.totp.qr_code;document.getElementById('secret').textContent='无法扫码时输入：'+data.totp.secret;document.getElementById('enrollPanel').hidden=false;this.hidden=true;document.getElementById('code').focus()}catch(error){show('生成失败：'+error.message,'error');this.disabled=false;this.textContent='重新生成绑定二维码'}});
  document.getElementById('setupForm').addEventListener('submit',async event=>{event.preventDefault();const code=document.getElementById('code').value.replace(/\D/g,'');if(!pendingFactor||code.length!==6){show('请输入应用中的 6 位验证码。','error');return}const button=document.getElementById('confirmButton');button.disabled=true;button.textContent='正在确认…';try{await ISAMFA.challengeAndVerify(client,pendingFactor.id,code);show('两步验证已成功开启。','success');setTimeout(()=>location.replace(returnTo),700)}catch(error){show('验证码无效或已过期，请核对设备时间后重试。','error');document.getElementById('code').select()}finally{button.disabled=false;button.textContent='确认绑定'}});
</script></body></html>
