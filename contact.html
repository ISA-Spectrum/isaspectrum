<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系我们 - ISA Spectrum</title>
    <link rel="stylesheet" href="./common.css">
    <style>
        /* 仅保留页面独有样式，导航、页脚、全局样式移入common.css */
        .main-content {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .contact-title {
            text-align: center;
            font-size: 36px;
            color: #333;
            margin-bottom: 10px;
        }

        .contact-subtitle {
            text-align: center;
            color: var(--text-gray);
            font-size: 14px;
            margin-bottom: 50px;
        }

        .contact-content {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 50px;
            margin-bottom: 40px;
        }

        .contact-image {
            flex: 1;
            min-width: 300px;
            text-align: center;
        }

        .contact-image img {
            max-width: 250px;
            height: auto;
        }

        .contact-info {
            flex: 1;
            min-width: 300px;
            font-size: 16px;
            line-height: 2;
        }

        .contact-info p {
            margin-bottom: 10px;
            color: #555;
        }

        .contact-info strong {
            color: #333;
        }

        .contact-button {
            display: block;
            width: 180px;
            height: 40px;
            line-height: 40px;
            text-align: center;
            border: 1px solid #333;
            color: #333;
            text-decoration: none;
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        .contact-button:hover {
            background-color: #333;
            color: white;
        }

        .contact-note {
            text-align: center;
            font-size: 16px;
            color: #555;
            max-width: 800px;
            margin: 0 auto 40px;
        }
    </style>
    <link rel="icon" type="image/png" href="/images/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <link rel="shortcut icon" href="/images/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ISA Spectrum" />
    <link rel="manifest" href="/images/site.webmanifest" />
</head>
<body>
    <!-- 公共头部挂载 -->
    <div id="headerBox"></div>

    <!-- 主要内容 -->
    <main class="main-content">
        <h1 class="contact-title"><br>CONTACT US</h1>
        <p class="contact-subtitle">联系我们</p>
        <p class="contact-note">如果发现问题、想加入我们、提供建议、举报违规行为或有其他相关需要，欢迎联系我们，我们会尽力为大家服务，请通过以下方式联系我们：</p>
        
        <div class="contact-content">
            <div class="contact-image">
                <img src="./images/logo.png" alt="联系我们装饰图">
            </div>
            
            <div class="contact-info">
                <p><strong>Mobile:</strong> 16602707968</p>
                <p><strong>QQ:</strong> 12158168</p>
                <p><strong>Email:</strong> peiguo.li29@isawuhan.com</p>
                <p><strong>Address:</strong> 武汉爱莎学校</p>
                <a href="mailto:peiguo.li29@isawuhan.com?subject=给ISA%20Spectrum%20官方的一封信&body=您好，我在使用ISA%20Spectrum时获得了一些灵感/发现了一些问题：%0A%0A" class="contact-button">CONTACT US</a>
            </div>
        </div>
    </main>

    <!-- 公共页脚挂载 -->
    <div id="footerBox"></div>

    <!-- 全局公共JS（导航+页脚渲染） -->
    <script src="./common.js"></script>
</body>
</html>
