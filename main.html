<!DOCTYPE html>
<html lang="zh">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>ISA Spectrum</title>
    <!-- 引入全局公共CSS -->
    <link rel="stylesheet" href="./common.css">
    <!-- 仅保留本页面独有样式：轮播 + 主页介绍区域 -->
    <style>
        /* 轮播专属 */
        .banner {
            margin-top: 60px;
            width: 100%;
            height: 56.25vw;
            max-height: 800px;
            position: relative;
            overflow: hidden;
        }
        .banner-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: 0.6s;
        }
        .banner-slide.active {
            opacity: 1;
        }
        /* 适配img铺满，和原background效果完全一致 */
        .banner-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .banner-dots {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
        }
        .banner-dot {
            width: 40px;
            height: 3px;
            background: rgba(255,255,255,0.5);
            margin: 0 5px;
        }
        .banner-dot.active {
            background: #fff;
        }
        /* 主页介绍内容专属 */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
            text-align: center;
        }
        .main-logo {
            width: 200px;
            margin-bottom: 30px;
        }
        .intro-text {
            font-size: 14px;
            color: var(--text-gray);
            line-height: 30px;
            max-width: 600px;
            margin: 0 auto 20px;
        }
        .intro-text-en {
            font-size: 12px;
            color: var(--text-light-gray);
            line-height: 26px;
            max-width: 600px;
            margin: 0 auto 30px;
        }
        .more-link {
            color: var(--theme-color);
            text-decoration: none;
            font-size: 14px;
        }
        /* 移动端轮播适配 */
        @media (max-width: 768px) {
            .banner {
                height: 60vw;
            }
        }
    </style>
    <link rel="icon" type="image/png" href="/images/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <link rel="shortcut icon" href="/images/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ISA Spectrum" />
    <link rel="manifest" href="/images/site.webmanifest" />
</head>
<body>
<!-- 公共头部容器（由common.js自动加载header.html） -->
<div id="headerBox"></div>

<section class="banner">
    <div class="banner-slide active">
        <picture>
            <source srcset="./images/1.webp" type="image/webp">
            <img src="./images/1.jpg" alt="ISA校园全景" loading="lazy" fetchpriority="high">
        </picture>
    </div>
    <div class="banner-slide">
        <picture>
            <source srcset="./images/2.webp" type="image/webp">
            <img src="./images/2.jpg" alt="黄昏校园全景" loading="lazy">
        </picture>
    </div>
    <div class="banner-dots">
        <span class="banner-dot active"></span>
        <span class="banner-dot"></span>
    </div>
</section>

<main class="main-content">
    <!-- Logo使用压缩后的PNG，加懒加载，稳定无兼容问题 -->
    <img src="./images/logo.png" class="main-logo" loading="lazy" alt="ISA Spectrum">
    <p class="intro-text">
        团队专注于校园趣事的无纸化展示、校墙和校园社区建设，为用户提供独特的阅读与留言体验。
    </p>
    <p class="intro-text-en">
        The team focuses on the paperless display and interactive comments of campus anecdotes.
    </p>
    <a href="about.html" class="more-link">MORE<br>————</a><br><br>
</main>

<!-- 公共页脚容器（由common.js自动加载footer.html） -->
<div id="footerBox"></div>

<!-- 加载全局公共JS：载入头尾+汉堡+导航高亮 -->
<script src="./common.js"></script>
<!-- 仅页面专属JS：轮播代码（完全不变） -->
<script>
let slides = document.querySelectorAll('.banner-slide');
let dots = document.querySelectorAll('.banner-dot');
let idx = 0;
function play(){
    slides.forEach(s=>s.classList.remove('active'));
    dots.forEach(d=>d.classList.remove('active'));
    slides[idx].classList.add('active');
    dots[idx].classList.add('active');
    idx = (idx+1)%slides.length;
}
setInterval(play,5000);
</script>
</body>
</html>
