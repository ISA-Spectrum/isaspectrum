<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="ISA 武汉校园社区：发现校园动态、参与校墙讨论、获取最新公告。">
  <title>ISA Spectrum · 武汉校园社区</title><link rel="stylesheet" href="./common.css"><link rel="icon" type="image/svg+xml" href="./images/favicon.svg"><link rel="manifest" href="./images/site.webmanifest">
  <script src="./auth-client.js" defer></script><script src="./home.js" defer></script>
  <style>
  .home-shell{width:min(1180px,calc(100% - 40px));margin:auto;padding-top:96px}.hero{position:relative;min-height:630px;overflow:hidden;border-radius:32px;background:var(--theme-deep);box-shadow:var(--shadow-lg)}.hero-track,.hero-slide{position:absolute;inset:0}.hero-slide{opacity:0;transform:scale(1.025);transition:opacity .7s,transform 1.1s}.hero-slide.active{opacity:1;transform:scale(1)}.hero-slide img{width:100%;height:100%;object-fit:cover}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(9,18,56,.94),rgba(9,18,56,.73) 48%,rgba(9,18,56,.13))}.hero-content{position:relative;z-index:2;display:flex;min-height:630px;width:min(600px,68%);padding:68px;flex-direction:column;justify-content:center;color:#fff}.eyebrow{display:inline-flex;align-items:center;align-self:flex-start;gap:9px;margin-bottom:24px;padding:8px 12px;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:rgba(255,255,255,.09);font-size:13px;font-weight:700}.live-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px rgba(201,255,71,.12)}.hero h1{margin:0;font-size:clamp(48px,7vw,86px);line-height:.98;letter-spacing:-.06em}.hero h1 span{color:var(--accent)}.hero-copy{max-width:480px;margin:26px 0 0;color:#d7dcef;font-size:17px}.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}.button{display:inline-flex;min-height:48px;align-items:center;justify-content:center;gap:9px;padding:0 20px;border:1px solid transparent;border-radius:14px;text-decoration:none;font-size:15px;font-weight:750;transition:transform .2s,box-shadow .2s}.button:hover{transform:translateY(-2px)}.button-primary{color:#111a07;background:var(--accent);box-shadow:0 12px 30px rgba(201,255,71,.16)}.button-secondary{color:#fff;border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.08)}.hero-controls{position:absolute;z-index:3;right:28px;bottom:28px;display:flex;align-items:center;gap:10px}.hero-control{width:44px;height:44px;border:1px solid rgba(255,255,255,.28);border-radius:50%;color:#fff;background:rgba(8,13,36,.45);cursor:pointer}.hero-control:hover{background:var(--theme-color)}.hero-dots{display:flex;gap:7px;padding:9px 12px;border-radius:999px;background:rgba(8,13,36,.45)}.hero-dot{width:7px;height:7px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.45);cursor:pointer}.hero-dot.active{width:24px;border-radius:9px;background:var(--accent)}
  .meal-entry{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center;margin:24px 0 72px;padding:32px 36px;overflow:hidden;border-radius:26px;color:#fff;background:linear-gradient(130deg,#111a38,#2146f3);box-shadow:var(--shadow-sm)}.meal-entry h2{margin:6px 0 8px;font-size:clamp(28px,4vw,44px);line-height:1.05;letter-spacing:-.04em}.meal-entry p{max-width:620px;margin:0;color:#dce3ff}.meal-entry-action{display:grid;min-width:250px;gap:12px;justify-items:end}.meal-entry-note{color:#cbd4f8;font-size:12px;text-align:right}.meal-entry-button{display:inline-flex;min-height:48px;align-items:center;justify-content:center;padding:0 20px;border-radius:14px;color:#111a07;background:var(--accent);font-weight:800;text-decoration:none;transition:transform .2s,box-shadow .2s}.meal-entry-button:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(201,255,71,.16)}
  .section{margin-bottom:72px}.section-heading{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:24px}.section-kicker{margin:0 0 5px;color:var(--theme-color);font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.section-heading h2{margin:0;font-size:clamp(32px,5vw,52px);line-height:1.05;letter-spacing:-.045em}.text-link{color:var(--theme-color);font-size:14px;font-weight:750;text-decoration:none;white-space:nowrap}.text-link:hover{text-decoration:underline;text-underline-offset:4px}.zone-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.zone-card{display:flex;min-height:300px;padding:24px;border:1px solid var(--line);border-radius:24px;background:#fff;box-shadow:var(--shadow-sm);flex-direction:column}.zone-head{display:flex;align-items:start;justify-content:space-between;gap:18px;padding-bottom:18px;border-bottom:1px solid var(--line)}.zone-title{display:flex;align-items:center;gap:12px}.zone-icon{display:grid;width:42px;height:42px;place-items:center;border-radius:14px;color:#fff;background:var(--theme-color);font-size:14px;font-weight:850}.zone-title h3{margin:0;font-size:20px}.zone-title p{margin:2px 0 0;color:var(--muted);font-size:12px}.zone-count{padding:5px 9px;border-radius:999px;color:var(--theme-color);background:var(--theme-soft);font-size:12px;font-weight:750}.zone-posts{display:grid;flex:1}.zone-post{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;padding:17px 0;border-bottom:1px solid #edf0f6;text-decoration:none}.zone-post:last-child{border-bottom:0}.zone-post strong{overflow:hidden;color:#303749;font-size:14px;font-weight:650;text-overflow:ellipsis;white-space:nowrap}.zone-post small{color:var(--muted)}.zone-post span{grid-column:1/-1;color:#7c859a;font-size:12px}.zone-link{align-self:flex-start;margin-top:12px;color:var(--theme-color);font-size:13px;font-weight:750;text-decoration:none}.zone-link:hover{text-decoration:underline;text-underline-offset:4px}.zone-empty{padding:30px 0;color:var(--muted);font-size:14px}.skeleton{position:relative;overflow:hidden;background:#e9edf6}.skeleton:after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:shimmer 1.3s infinite}.skeleton-line{height:14px;margin:16px 0;border-radius:8px}.skeleton-line.short{width:48%}@keyframes shimmer{to{transform:translateX(100%)}}
  .notice-panel{display:grid;grid-template-columns:.8fr 1.2fr;overflow:hidden;border-radius:28px;color:#fff;background:var(--ink)}.notice-intro{padding:40px;background:var(--theme-color)}.notice-intro h2{margin:8px 0 14px;font-size:38px;line-height:1.05;letter-spacing:-.04em}.notice-intro p{margin:0;color:#dbe1ff}.notice-list{display:grid;padding:22px 30px}.notice-row{display:grid;grid-template-columns:86px 1fr auto;gap:18px;align-items:center;padding:18px 4px;border-bottom:1px solid #2c3245;text-decoration:none}.notice-row:last-child{border-bottom:0}.notice-date{color:#8f98af;font-size:12px}.notice-title{color:#fff;font-weight:700}.notice-row span:last-child{color:var(--accent)}
  @media(max-width:860px){.home-shell{width:min(100% - 28px,1180px);padding-top:82px}.hero,.hero-content{min-height:650px}.hero-content{width:100%;padding:38px 26px 110px;justify-content:flex-end}.hero:after{background:linear-gradient(0deg,rgba(9,18,56,.96),rgba(9,18,56,.62) 58%,rgba(9,18,56,.12))}.hero h1{font-size:clamp(48px,15vw,72px)}.hero-controls{right:auto;left:26px}.zone-grid{grid-template-columns:1fr}.meal-entry{grid-template-columns:1fr}.meal-entry-action{min-width:0;justify-items:start}.meal-entry-note{text-align:left}.notice-panel{grid-template-columns:1fr}}
  @media(max-width:520px){.hero{border-radius:24px}.hero-content{padding:32px 22px 105px}.hero h1{font-size:48px}.hero-copy{font-size:16px}.button{width:100%}.section{margin-bottom:56px}.section-heading{display:block}.section-heading .text-link{display:inline-block;margin-top:12px}.meal-entry{padding:26px 24px}.meal-entry-button{width:100%}.notice-intro{padding:30px 24px}.notice-list{padding:10px 22px}.notice-row{grid-template-columns:1fr auto;gap:8px 14px}.notice-date{grid-column:1/-1}}
  </style>
</head>
<body><div id="headerBox"></div><main class="home-shell">
  <section class="hero" aria-label="校园精选" aria-roledescription="carousel"><div class="hero-track" aria-live="polite"><div class="hero-slide active" data-label="ISA 武汉校园日景"><picture><source srcset="./images/1.webp" type="image/webp"><img src="./images/1.jpg" alt="ISA 武汉校园日景" fetchpriority="high"></picture></div><div class="hero-slide" data-label="ISA 武汉校园黄昏"><picture><source srcset="./images/2.webp" type="image/webp"><img src="./images/2.jpg" alt="ISA 武汉校园黄昏"></picture></div></div>
    <div class="hero-content"><div class="eyebrow"><span class="live-dot"></span><span id="dayGreeting">校园社区在线</span></div><h1>校园正在<br><span>发生。</span></h1><p class="hero-copy">分享新鲜事，听见不同声音，在 ISA Spectrum 找到属于我们的校园现场。</p><div class="hero-actions"><a class="button button-primary" href="messages.html">进入校墙 <span aria-hidden="true">↗</span></a><a class="button button-secondary" href="notice.html">查看最新公告</a></div></div>
    <div class="hero-controls"><button class="hero-control" id="prevSlide" type="button" aria-label="上一张">←</button><div class="hero-dots" id="heroDots" aria-label="选择轮播图片"></div><button class="hero-control" id="nextSlide" type="button" aria-label="下一张">→</button></div>
  </section>
  <section class="meal-entry" aria-labelledby="mealTitle"><div><p class="section-kicker" style="color:var(--accent)">Daily meal check</p><h2 id="mealTitle">每日餐食评分</h2><p>登录账号后，在独立页面分别评价早餐、午餐和晚餐，也可以留下具体建议。</p></div><div class="meal-entry-action"><span class="meal-entry-note" id="mealEntryNote">反馈会与当前登录账号绑定</span><a class="meal-entry-button" id="mealEntryLink" href="login.html?returnTo=meal-rating.html">登录后评分 →</a></div></section>
  <section class="section" aria-labelledby="feedTitle"><div class="section-heading"><div><p class="section-kicker">Find your corner</p><h2 id="feedTitle">校墙分区</h2></div><a class="text-link" href="messages.html">进入校园广场 →</a></div><div class="zone-grid" id="latestFeed" aria-live="polite"><div class="zone-card"><div class="skeleton skeleton-line short"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line"></div></div><div class="zone-card"><div class="skeleton skeleton-line short"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line"></div></div><div class="zone-card"><div class="skeleton skeleton-line short"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line"></div></div><div class="zone-card"><div class="skeleton skeleton-line short"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line"></div></div></div></section>
  <section class="section notice-panel" aria-labelledby="noticeTitle"><div class="notice-intro"><p class="section-kicker" style="color:var(--accent)">Stay informed</p><h2 id="noticeTitle">最近更新</h2><p>重要变化、功能说明与社区规则，一处掌握。</p></div><div class="notice-list" id="latestNotices"><div class="notice-row"><span class="notice-date">正在同步</span><span class="notice-title">读取最新公告…</span><span>→</span></div></div></section>
</main><div id="footerBox"></div><script src="./common.js"></script></body></html>
