<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ISA Spectrum 审核端</title>
  <link rel="icon" type="image/svg+xml" href="./images/favicon.svg">
  <script src="./auth-client.js"></script>
  <style>*{box-sizing:border-box}body{display:grid;min-height:100vh;margin:0;place-items:center;background:#fff;font-family:system-ui}.splash{text-align:center}.logo{width:150px}.title{margin-top:18px;color:#1e50ae;font-size:30px;font-weight:700}.domain{margin-top:8px;color:#666}</style>
</head>
<body><main class="splash">
  <img src="./images/logo.png" class="logo" alt="ISA Spectrum">
  <div class="title">ISA Spectrum 审核端</div>
  <div class="domain">正在验证登录状态和审核员权限…</div>
</main><script>
  (async()=>{
    const session=await ISAAuth.getSession().catch(()=>null);
    if(session?.authenticated){
      location.replace(session.user?.checker?'/checker-pending.html':'/login-messageschecker.html?error=forbidden');
      return;
    }
    location.replace('/auth/login?return_to=%2Fchecker-pending.html');
  })();
</script></body>
</html>
