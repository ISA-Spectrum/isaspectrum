<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于ISA Spectrum</title>
    <!-- 引入公共全局样式 -->
    <link rel="stylesheet" href="./common.css">
    <style>
        /* 只保留页面独有样式，删除全局、导航、页脚通用CSS */
        .main-content {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .page-title {
            text-align: center;
            font-size: 32px;
            color: var(--theme-color);
            margin-bottom: 40px;
        }

        .content-section {
            margin-bottom: 40px;
            line-height: 1.8;
            color: #555;
            font-size: 16px;
            text-align: center;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .shuier-button {
            display: inline-block;
            background-color: var(--theme-color);
            color: white;
            padding: 10px 30px;
            border-radius: 25px;
            text-decoration: none;
            margin-top: 20px;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        .shuier-button:hover {
            background-color: #15408f;
        }

        /* Banner专属样式 */
        .about-banner {
            margin-top: 60px;
            width: 100%;
            max-width: 100%;
            height: 350px;
            background-size: cover;
            background-position: center;
            display: block;
        }
        @media (max-width: 768px) {
            .about-banner {
                height: 100px;
            }
        }
    </style>
    <link rel="icon" type="image/png" href="/images/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <link rel="shortcut icon" href="/images/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ISA Spectrum" />
    <link rel="manifest" href="/images/site.webmanifest" />
</head>
<body>
    <!-- 公共头部挂载容器 -->
    <div id="headerBox"></div>

    <div class="about-banner" style="background-image: url('./images/about-banner.png');"></div>

    <main class="main-content">
        <div class="content-section">
            <p>ISA Spectrum是武汉爱莎学校学生打造的一个校园公共社区，大家可以用它发表自己的见闻感想、让它们被更多人看到，除了网页，我们现在推出了客户端（支持Mac、Windows、安卓系统），大家可以点击导航栏中的“客户端下载”下载体验（不必在意所谓的不明开发者，那只是因为官方没有花钱买公证）。如果想免费支持作者，可以访问<a href="https://github.com/ISA-Spectrum/isaspectrum" target="_blank" style="color:var(--theme-color);text-decoration:underline;font-weight:500;">ISA Spectrum源代码仓库</a>，点击右上角Star支持（免费）。<br><br><span style="font-size:22px;font-weight:bold;color:#19408f;">当前客户端版本：v3.3.2 Release</span></p>
            <p style="margin-top: 15px;">ISA Spectrum的作者笔名为沧海四象，其他作品还有《水二杂记》（点击下面按钮以查看）</p>
            <a href="https://mose.cc.cd" target="_blank" class="shuier-button">《水二杂记》官网</a>
        </div>
    </main>

    <!-- 公共页脚挂载容器 -->
    <div id="footerBox"></div>

    <!-- 全局导航JS统一引入 -->
    <script src="./common.js"></script>
</body>
</html>
