<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于Mac_app服务暂停的说明</title>
    <!-- 引入公共全局样式 -->
    <link rel="stylesheet" href="./common.css">
    <style>
        /* 页面独有样式 */
        .main-content {
            max-width: 1200px;
            margin: 80px auto;
            padding: 0 20px;
        }

        .page-title {
            text-align: center;
            font-size: 34px;
            color: var(--theme-color);
            margin-bottom: 50px;

        }

            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg, #f9f9f9);
            padding: 40px 35px;
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.07);
        }

        .content-section {
            line-height: 1.9;
            color: #444;
            font-size: 16px;
            text-align: center;
        }

        .tip-text {
            margin-top: 25px;
            font-size: 15px;
            color: #666;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

    <link rel="icon" type="image/png" href="/images/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <link rel="shortcut icon" href="/images/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ISA Spectrum" />

    <!-- 公共头部挂载容器 -->
    <div id="headerBox"></div>
    <main class="main-content">
        <h1 class="page-title">服务状态说明</h1>
        <div class="info-card">
            <div class="content-section">
                <p>您好！由于项目开发者为在校学生，所用设备权限受限，安装 Xcode 后导致 <strong>Git 推送、本地服务调试</strong> 等开发指令暂时被系统锁定，目前正在全力排查与修复。</p>
                <p class="tip-text">受此影响，macOS 客户端制作工作暂时暂停，Mac 端下载服务临时关闭。问题解决后我们会第一时间恢复全部功能，感谢大家的理解与耐心等待！</p>
            </div>
        </div>
    </main>

    <!-- 公共页脚挂载容器 -->
    <div id="footerBox"></div>

    <!-- 全局导航JS统一引入 -->
    <script src="./common.js"></script>
