<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>重置密码 - ISA Spectrum</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4/dist/umd/supabase.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: #f0f2f5; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .login-box { background: #fff; padding: 40px 30px; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); width: 100%; max-width: 400px; }
        .login-box h2 { text-align: center; margin-bottom: 8px; color: #1e50ae; font-size: 24px; }
        .login-box .sub { text-align: center; color: #888; font-size: 14px; margin-bottom: 30px; }
        .login-box input { width: 100%; padding: 14px 16px; margin-bottom: 8px; border: 1px solid #ddd; border-radius: 10px; font-size: 15px; transition: border-color 0.2s; }
        .login-box input:focus { outline: none; border-color: #1e50ae; }
        .login-btn { width: 100%; padding: 14px; background: #1e50ae; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .login-btn:hover { background: #15408f; }
        .login-btn:disabled { background: #999; cursor: not-allowed; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #1e50ae; text-decoration: none; font-size: 14px; }
        .error-msg { color: #dc3545; text-align: center; font-size: 13px; margin-top: 8px; display: none; }
        .success-msg { color: #198754; text-align: center; font-size: 13px; margin-top: 8px; display: none; }
        .input-error { border-color: #dc3545 !important; }
        .tip-text { font-size: 12px; color: #666; margin: 0 0 14px 4px; }
    </style>
    <link rel="icon" type="image/png" href="/images/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <link rel="shortcut icon" href="/images/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ISA Spectrum" />
    <link rel="manifest" href="/images/site.webmanifest" />
</head>
<body>
    <div class="login-box">
        <h2>设置新密码</h2>
        <p class="sub">请输入并确认你的新密码</p>
        <input id="newPwd" placeholder="新密码" type="password">
        <p class="tip-text">密码规则：至少8位，需同时包含字母和数字</p>
        <input id="confirmPwd" placeholder="确认新密码" type="password">

        <button class="login-btn" id="submitBtn" disabled>确认修改</button>
        <p class="error-msg" id="errorMsg"></p>
        <p class="success-msg" id="successMsg"></p>
        <a href="login.html" class="back-link">返回登录</a>
    </div>

    <script>
        const SUPABASE_URL = 'https://bbcnrsktqarvceekrswb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_f3Kav8ipJco_f9tw5zO50A_w7KigE5D';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const newPwd = document.getElementById('newPwd');
        const confirmPwd = document.getElementById('confirmPwd');
        const submitBtn = document.getElementById('submitBtn');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');

        // 密码规则
        function checkPwdRule(pwd) {
            const regNum = /\d/;
            const regLetter = /[a-zA-Z]/;
            return pwd.length >= 8 && regNum.test(pwd) && regLetter.test(pwd);
        }

        // 表单实时校验
        function validateForm() {
            const p1 = newPwd.value;
            const p2 = confirmPwd.value;
            newPwd.classList.remove('input-error');
            confirmPwd.classList.remove('input-error');

            let valid = true;
            if(!checkPwdRule(p1)){
                newPwd.classList.add('input-error');
                valid = false;
            }
            if(p1 !== p2 || p2 === ''){
                confirmPwd.classList.add('input-error');
                valid = false;
            }
            submitBtn.disabled = !valid;
        }

        newPwd.addEventListener('input', validateForm);
        confirmPwd.addEventListener('input', validateForm);

        // 解析链接 token
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        const access_token = params.get('access_token');
        const refresh_token = params.get('refresh_token');

        if (access_token && refresh_token) {
            supabase.auth.setSession({
                access_token: access_token,
                refresh_token: refresh_token
            }).then(({ data, error }) => {
                if (error) {
                    errorMsg.textContent = '会话无效，请从重置邮件的链接重新进入';
                    errorMsg.style.display = 'block';
                    submitBtn.disabled = true;
                }
            }).catch(err => {
                errorMsg.textContent = '会话初始化失败：' + err.message;
                errorMsg.style.display = 'block';
                submitBtn.disabled = true;
            });
        } else {
            errorMsg.textContent = '链接不完整，请使用邮件中的重置链接（需包含 access_token 和 refresh_token）';
            errorMsg.style.display = 'block';
            submitBtn.disabled = true;
        }

        async function updatePassword() {
            const session = await supabase.auth.getSession();
            if (!session.data.session) {
                errorMsg.textContent = '会话已失效，请重新发送重置邮件';
                errorMsg.style.display = 'block';
                return;
            }

            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            const pwd1 = newPwd.value.trim();
            const pwd2 = confirmPwd.value.trim();

            submitBtn.disabled = true;
            submitBtn.textContent = '提交中...';

            const { error } = await supabase.auth.updateUser({ password: pwd1 });

            submitBtn.disabled = false;
            submitBtn.textContent = '确认修改';

            if (error) {
                errorMsg.textContent = '修改失败：' + error.message;
                errorMsg.style.display = 'block';
            } else {
                successMsg.textContent = '密码修改成功！即将跳转登录页';
                successMsg.style.display = 'block';
                await supabase.auth.signOut();
                setTimeout(() => location.href = 'login.html', 2000);
            }
        }

        submitBtn.addEventListener('click', updatePassword);
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !submitBtn.disabled) {
                updatePassword();
            }
        });
    </script>
</body>
</html>
