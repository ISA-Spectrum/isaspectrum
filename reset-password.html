<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>重置密码 - ISA Spectrum</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4/dist/umd/supabase.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: #f0f2f5; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .login-box { background: #fff; padding: 40px 30px; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); width: 100%; max-width: 400px; }
        .login-box h2 { text-align: center; margin-bottom: 8px; color: #1e50ae; font-size: 24px; }
        .login-box .sub { text-align: center; color: #888; font-size: 14px; margin-bottom: 30px; }
        .login-box input { width: 100%; padding: 14px 16px; margin-bottom: 16px; border: 1px solid #ddd; border-radius: 10px; font-size: 15px; transition: border-color 0.2s; }
        .login-box input:focus { outline: none; border-color: #1e50ae; }
        .login-btn { width: 100%; padding: 14px; background: #1e50ae; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .login-btn:hover { background: #15408f; }
        .login-btn:disabled { background: #999; cursor: not-allowed; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #1e50ae; text-decoration: none; font-size: 14px; }
        .error-msg { color: #dc3545; text-align: center; font-size: 13px; margin-top: 8px; display: none; }
        .success-msg { color: #198754; text-align: center; font-size: 13px; margin-top: 8px; display: none; }
    </style>
    <link rel="icon" type="image/png" href="/images/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <link rel="shortcut icon" href="/images/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ISA Spectrum" />
    <link rel="manifest" href="/images/site.webmanifest" />
</head>
<body>
    <div class="login-box">
        <h2>设置新密码</h2>
        <p class="sub">请输入并确认你的新密码</p>
        <input id="newPwd" placeholder="新密码" type="password">
        <input id="confirmPwd" placeholder="确认新密码" type="password">
        <button class="login-btn" id="submitBtn">确认修改</button>
        <p class="error-msg" id="errorMsg"></p>
        <p class="success-msg" id="successMsg"></p>
        <a href="login.html" class="back-link">返回登录</a>
    </div>

    <script>
        const SUPABASE_URL = 'https://bbcnrsktqarvceekrswb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_f3Kav8ipJco_f9tw5zO50A_w7KigE5D';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const newPwd = document.getElementById('newPwd');
        const confirmPwd = document.getElementById('confirmPwd');
        const submitBtn = document.getElementById('submitBtn');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');

        // 同时支持两种 token 格式，只要有一个就启用按钮
        let access_token = null;

        // 1. 先读 #access_token= 格式
        const hash = window.location.hash.substring(1);
        const hashParams = new URLSearchParams(hash);
        access_token = hashParams.get('access_token');

        // 2. 再读 ?code= 格式（如果上面没有）
        if (!access_token) {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            if (code) {
                // 尝试用 code 兑换 token
                supabase.auth.exchangeCodeForSession(code).then(({ data, error }) => {
                    if (!error && data.session) {
                        access_token = data.session.access_token;
                        submitBtn.disabled = false;
                        errorMsg.style.display = 'none';
                    }
                });
            }
        }

        // 只要有 access_token，直接启用按钮
        if (access_token) {
            submitBtn.disabled = false;
            errorMsg.style.display = 'none';
        } else {
            errorMsg.textContent = '请从重置邮件的链接进入此页面';
            errorMsg.style.display = 'block';
            submitBtn.disabled = true;
        }

        // 修改密码逻辑
        async function updatePassword() {
            if (!access_token) {
                errorMsg.textContent = '会话无效，请从重置邮件的链接重新进入';
                errorMsg.style.display = 'block';
                return;
            }

            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            const pwd1 = newPwd.value.trim();
            const pwd2 = confirmPwd.value.trim();

            if (!pwd1 || !pwd2) {
                errorMsg.textContent = '请填写完整密码';
                errorMsg.style.display = 'block';
                return;
            }
            if (pwd1 !== pwd2) {
                errorMsg.textContent = '两次输入的密码不一致';
                errorMsg.style.display = 'block';
                return;
            }
            if (pwd1.length < 6) {
                errorMsg.textContent = '密码长度至少6位';
                errorMsg.style.display = 'block';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '提交中...';

            // 直接用 access_token 更新密码，不依赖会话
            const { error } = await supabase.auth.updateUser(
                { password: pwd1 },
                { access_token: access_token }
            );

            submitBtn.disabled = false;
            submitBtn.textContent = '确认修改';

            if (error) {
                errorMsg.textContent = '修改失败：' + error.message;
                errorMsg.style.display = 'block';
            } else {
                successMsg.textContent = '密码修改成功！即将跳转登录页';
                successMsg.style.display = 'block';
                setTimeout(() => location.href = 'login.html', 2000);
            }
        }

        submitBtn.addEventListener('click', updatePassword);
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                updatePassword();
            }
        });
    </script>
</body>
</html>
