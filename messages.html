// ===================== 新增：通用图片压缩核心函数 =====================
function compressImage(file, options = {}) {
    return new Promise((resolve, reject) => {
        // 非图片文件直接返回原文件
        if (!file.type.startsWith('image/')) {
            return resolve(file);
        }
        // 默认配置
        const defaultOpts = {
            maxWidth: 1920,
            maxHeight: 1080,
            quality: 0.6,
            mimeType: "image/webp"
        };
        const opts = { ...defaultOpts, ...options };

        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = e => {
            const img = new Image();
            img.src = e.target.result;
            img.onload = () => {
                let width = img.width;
                let height = img.height;
                // 等比缩放
                const scaleRatio = Math.min(opts.maxWidth / width, opts.maxHeight / height);
                if (scaleRatio < 1) {
                    width = width * scaleRatio;
                    height = height * scaleRatio;
                }
                const canvas = document.createElement("canvas");
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, width, height);

                canvas.toBlob(blob => {
                    if (!blob) return reject("图片压缩失败");
                    // 重命名后缀
                    const suffix = opts.mimeType === "image/webp" ? ".webp" : ".jpg";
                    const newFileName = file.name.replace(/(\.\w+)$/, suffix);
                    const compressedFile = new File([blob], newFileName, { type: opts.mimeType });
                    resolve(compressedFile);
                }, opts.mimeType, opts.quality);
            };
            img.onerror = () => reject("图片加载失败");
        };
        reader.onerror = () => reject("文件读取失败");
    });
}

function parseMessageContent(content = '', storedZone = '') {
    const marker = content.match(/^【([^】]+)】\s*/);
    const validZones = ['校园生活', ...MESSAGE_ZONES.map(zone => zone.label)];
    const explicitZone = validZones.includes(marker?.[1]) ? marker[1] : '';
    const text = explicitZone ? content.replace(/^【[^】]+】\s*/, '') : content;
    const inferredZone = MESSAGE_ZONES.find(zone => zone.keywords.some(word => text.includes(word)))?.label;
    return { zone: validZones.includes(storedZone) ? storedZone : (explicitZone || inferredZone || '校园生活'), text };
}

async function openNotifications(append = false) {

    // 加载锁，防止并发重复请求

    if (!append) {
        notifyPage = 0;
        notifyHasMore = true;
        listEl.innerHTML = '<div style="text-align:center;padding:20px 0;color:#999;">加载通知中...</div>';
    }

    const from = notifyPage * NOTIFY_PAGE_SIZE;
    const to = from + NOTIFY_PAGE_SIZE - 1;

            .from("notifications")
            .select("id, title, content, created_at, type, read")
            .eq("user_id", userId)
            .order("created_at", { ascending: false })
            .range(from, to);

        if (loadingTip && !append) loadingTip.remove();

                listEl.innerHTML = `<div style='text-align:center;padding:30px;color:#999;'>暂无通知</div>`;

                listEl.insertAdjacentHTML('beforeend', `<div style="text-align:center;padding:15px 0;color:#aaa;font-size:13px;">没有更多通知了</div>`);

            notifyLoading = false;

        });

        // 首次打开清空，滚动加载追加
        if (!append) listEl.innerHTML = "";
        listEl.appendChild(htmlFragment);

        // 当前页不足分页条数 = 无更多历史通知

        // 仅第一次打开弹窗批量标记全部未读为已读，滚动加载不再重复更新

    } finally {
        notifyLoading = false;
    }
}

// ===================== 改造：批量压缩留言图片再上传 =====================
async function uploadImages(files) {
    if (!files || files.length === 0) return [];
    const urlList = [];
    const progressBar = document.getElementById('progressBar');
    const uploadProgress = document.getElementById('uploadProgress');
    uploadProgress.style.display = 'block';
    progressBar.style.width = '0%';
    try {
        // 循环压缩每一张图片
        const compressedFiles = [];
        for (const file of files) {
            // 小于100KB原图跳过压缩，避免画质损耗
            if (file.size < 100 * 1024) {
                compressedFiles.push(file);
            } else {
                const compressFile = await compressImage(file, {
                    maxWidth: 1920,
                    maxHeight: 1080,
                    quality: 0.6,
                    mimeType: "image/webp"
                });
                compressedFiles.push(compressFile);
            }
        }
        // 上传压缩后的文件
        for (let i = 0; i < compressedFiles.length; i++) {
            const file = compressedFiles[i];
            const fileName = `${Date.now()}-${Math.random().toString(36).slice(2)}-${file.name}`;
            const { error } = await supabase.storage.from(STORAGE_BUCKET).upload(fileName, file);
            if (error) throw new Error(`图片上传失败: ${error.message}`);
            const { data: urlData } = supabase.storage.from(STORAGE_BUCKET).getPublicUrl(fileName);
            urlList.push(urlData.publicUrl);
            progressBar.style.width = `${((i + 1) / compressedFiles.length) * 100}%`;
        }
        return urlList;
    } catch (error) {
        throw error;
    } finally {
        uploadProgress.style.display = 'none';
    }
}

// 加载留言（核心分页+懒加载）
async function loadMainMessages(isLoadMore = false) {
    if (isLoadMore && (!hasMore || isLoadingMore)) return;
    if (isLoadMore) isLoadingMore = true;

    // 终止上一次未完成请求
    if (abortController) abortController.abort();
    abortController = new AbortController();
    const signal = abortController.signal;

    const container = document.getElementById('messageContainer');
    const loadMoreWrap = document.getElementById('loadMoreWrapper');

    // 首次加载
    if (!isLoadMore) {
        container.innerHTML = '<div class="loading">加载留言中...</div>';
        currentPage = 0;
        hasMore = true;
        if (loadMoreWrap) loadMoreWrap.remove();
        document.querySelector('.no-more-tip')?.remove();
    } else {
        // 滚动加载时显示加载状态
        if (!document.querySelector('.list-loading-tip')) {
            container.insertAdjacentHTML('beforeend', '<div class="loading list-loading-tip">加载更多...</div>');
        }
    }

    const from = currentPage * PAGE_SIZE;
    const to = from + PAGE_SIZE - 1;

    try {
        let query = supabase
            .from('messages')
            .select('id,user_id,username,content,zone,pic_url,created_at', { count: 'exact' })
            .eq('flag', 1)
            .is('reply_to', null)
            .order('created_at', { ascending: activeSort === 'oldest' });
        if (activeSearch) query = query.ilike('content', `%${activeSearch}%`);
        if (activeZone !== 'all') query = query.eq('zone', activeZone);
        const { data, error, count } = await query.range(from, to);

        if (signal.aborted) return;
        if (error) throw error;

        // 判断是否还有数据
        const totalLoaded = (currentPage + 1) * PAGE_SIZE;
        if (!count || totalLoaded >= count) {
            hasMore = false;
        }

        // 移除加载提示
        const loadingTip = document.querySelector('.list-loading-tip');
        if (loadingTip) loadingTip.remove();

        if (!data || data.length === 0) {
            if (!isLoadMore) {
                container.innerHTML = `<div class="empty-message">${activeSearch ? '没有找到相关留言，试试其他关键词。' : '暂无留言，快来发布第一条留言吧！'}</div>`;
            }
            hasMore = false;
            showNoMoreTip();
            userMap = {};
            return;
        }

        data.forEach(msg => { userMap[msg.id] = msg.username; });

        let html = '';
        for (let msg of data) {
            const parsedContent = parseMessageContent(msg.content, msg.zone);
            const time = new Date(msg.created_at).toLocaleString('zh-CN');
            let imageHtml = '';
            if (msg.pic_url && msg.pic_url.length > 0) {
                imageHtml = '<div class="message-images">';
                for (let url of msg.pic_url) {
                    imageHtml += `<img src="${escapeHtml(url)}" class="message-image" alt="${escapeHtml(msg.username)} 发布的图片" loading="lazy" onclick="window.open(this.src)">`;
                }
                imageHtml += '</div>';
            }
            html += `
            <div class="message-item" id="message-${msg.id}" data-user-id="${msg.user_id || ''}" data-anonymous="${msg.username === '匿名用户' ? 'true' : 'false'}">
                <div class="message-avatar-box"></div>
                <div style="flex:1">
                    <div class="message-header">
                        <span class="message-author">${escapeHtml(msg.username)}</span>
                        <span class="message-time">${time}</span>
                    </div>
                    <span class="message-zone">${escapeHtml(parsedContent.zone)}</span>
                    <div class="message-content">${escapeHtml(parsedContent.text).replace(/\n/g, '<br>')}</div>
                    ${imageHtml}
                    <button class="detail-btn" onclick="goToDetails('${msg.id}')">🔍 查看详情</button>
                </div>
            </div>`;
        }

        if (!html && !isLoadMore) {
            container.innerHTML = '<div class="empty-message">这个分区暂时没有留言，来发布第一条吧！</div>';
            showNoMoreTip();
            return;
        }

        if (isLoadMore) {
            container.insertAdjacentHTML('beforeend', html);
            currentPage++;
        } else {
            container.innerHTML = html;
            currentPage++;
        }
        if (!hasMore) {
            showNoMoreTip();
        }

        renderMessageAvatars();
    } catch (err) {
        if (signal.aborted) return;
        if (!isLoadMore) {
            container.innerHTML = `<div class="empty-message">加载失败：${err.message}</div>`;
        }
    } finally {
        isLoadingMore = false;
    }
}

        // 距离底部80px提前加载下一页通知
        if (scrollTop + viewHeight >= totalHeight - 80) {
            await openNotifications(true);
        }
    });

    // 留言列表页面滚动懒加载
    window.addEventListener('scroll', () => {
        if (isLoadingMore || !hasMore) return;
        clearTimeout(scrollTimeout);

        scrollTimeout = setTimeout(() => {
            const scrollTop = Math.max(window.pageYOffset, document.documentElement.scrollTop);
            const viewHeight = window.innerHeight;
            const docHeight = document.documentElement.scrollHeight;

            // 严谨触底判断
            if (scrollTop + viewHeight >= docHeight - SCROLL_THRESHOLD) {
                loadMainMessages(true);
            }
        }, 120);
    });
};

// 页面卸载，终止请求、清除定时器
window.addEventListener('beforeunload', () => {
    if (abortController) abortController.abort();
    if (scrollTimeout) clearTimeout(scrollTimeout);
});
    </script>
</body>
</html>
