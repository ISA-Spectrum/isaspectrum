    <script>
let currentPage = 0;
const PAGE_SIZE = 20;
let hasMore = true;
let isLoadingMore = false;
let scrollTimeout = null;
let abortController = null; // 取消上一次请求，防止多余请求

// ========== 新增通知分页全局变量 ==========
let notifyPage = 0;
const NOTIFY_PAGE_SIZE = 10;
let notifyHasMore = true;
let notifyLoading = false;

const SUPABASE_URL = 'https://bbcnrsktqarvceekrswb.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJiY25yc2t0cWFydmNlZWtyc3diIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MjUxODYsImV4cCI6MjA5NTEwMTE4Nn0.Mu6GW91z1HW2iX-tbQgH5qXrvpG2SPc9QoqCxGvV-54';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const STORAGE_BUCKET = 'message-pics';
const MAX_IMAGES = 5;
const MAX_SIZE = 5 * 1024 * 1024;
const SCROLL_THRESHOLD = 350; // 触底提前距离

let userMap = {};

let currentUserEmail = '';
let currentUserRealName = '';
let userId = '';

// 头像去缓存
function getFreshAvatar(src) {
    if (!src) return "";
    const sp = src.includes('?') ? '&t=' : '?t=';
    return src + sp + Date.now();
}

// 发送通知
async function sendNotificationToUser(targetUserId, title, content, type, relatedId = null) {
    await supabase.from("notifications").insert([
        { user_id: targetUserId, title, content, type, related_id: relatedId, read: false }
    ]);
}

async function sendNotificationToAllAuditors(title, content, relatedId = null) {
    const { data: checkers } = await supabase.from("checkers").select("user_id");
    if (!checkers) return;
    const notices = checkers.map(c => ({
        user_id: c.user_id, title, content, type: "audit", related_id: relatedId, read: false
    }));
    if (notices.length === 0) return;
    await supabase.from("notifications").insert(notices);
}

// 刷新通知红点（页面加载仅查1条id，不阻塞）
async function refreshNotificationDot() {
    if (!userId) return;
    const { data } = await supabase
        .from("notifications")
        .select("id")
        .eq("user_id", userId)
        .eq("read", false)
        .limit(1);
    const hasUnread = data?.length > 0;
    notificationDot.style.display = hasUnread ? "block" : "none";
    dropdownDot.style.display = hasUnread ? "inline-block" : "none";
}

// ========== 改造后：支持滚动懒加载、无上限通知加载函数 ==========
async function openNotifications(append = false) {
    const modal = document.getElementById("notificationModal");
    modal.style.display = "flex";
    const listEl = document.getElementById("notificationList");

    // 加载锁，防止并发重复请求
    if (notifyLoading) return;
    notifyLoading = true;

    // 首次打开弹窗：重置分页、清空列表
    if (!append) {
        notifyPage = 0;
        notifyHasMore = true;
        listEl.innerHTML = '<div style="text-align:center;padding:20px 0;color:#999;">加载通知中...</div>';
    }

    const from = notifyPage * NOTIFY_PAGE_SIZE;
    const to = from + NOTIFY_PAGE_SIZE - 1;

    try {
        // 只查询必要字段，不select(*)，节省流量
        const { data: notes, error } = await supabase
            .from("notifications")
            .select("id, title, content, created_at, type, read")
            .eq("user_id", userId)
            .order("created_at", { ascending: false })
            .range(from, to);

        if (error) throw error;

        // 移除加载提示
        const loadingTip = listEl.querySelector('div[style*="text-align:center;padding:20px 0"]');
        if (loadingTip && !append) loadingTip.remove();

        // 无通知数据
        if (!notes || notes.length === 0) {
            notifyHasMore = false;
            if (!append) {
                listEl.innerHTML = `<div style='text-align:center;padding:30px;color:#999;'>暂无通知</div>`;
            } else {
                listEl.insertAdjacentHTML('beforeend', `<div style="text-align:center;padding:15px 0;color:#aaa;font-size:13px;">没有更多通知了</div>`);
            }
            notifyLoading = false;
            return;
        }

        // 使用文档碎片批量渲染DOM，减少重绘卡顿
        const htmlFragment = document.createDocumentFragment();
        notes.forEach(n => {
            const itemDiv = document.createElement("div");
            itemDiv.className = `notification-item ${n.type === 'rejected' ? 'rejected' : ''}`;
            itemDiv.innerHTML = `
              <h4>${escapeHtml(n.title)}</h4>
              <p>${escapeHtml(n.content)}</p>
              <p style='font-size:12px;color:#999;margin:5px 0 0 0;'>${new Date(n.created_at).toLocaleString()}</p>
            `;
            htmlFragment.appendChild(itemDiv);
        });

        // 首次打开清空，滚动加载追加
        if (!append) listEl.innerHTML = "";
        listEl.appendChild(htmlFragment);

        // 当前页不足分页条数 = 无更多历史通知
        if (notes.length < NOTIFY_PAGE_SIZE) notifyHasMore = false;

        // 仅第一次打开弹窗批量标记全部未读为已读，滚动加载不再重复更新
        if (!append) {
            await supabase.from("notifications").update({ read: true }).eq("user_id", userId).eq("read", false);
            refreshNotificationDot();
        }

        notifyPage++;
    } catch (err) {
        listEl.innerHTML = `<div style="color:red;text-align:center;padding:20px;">加载失败：${err.message}</div>`;
    } finally {
        notifyLoading = false;
    }
}

// 初始化头像
async function initUserExtra() {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) return;
    userId = user.id;
    const { data } = await supabase.from("profiles").select("avatar_url").eq("user_id", userId).single();
    const url = data?.avatar_url;
    if (url) {
        document.getElementById("avatarImg").src = getFreshAvatar(url);
        document.getElementById("avatarImg").style.display = "block";
        document.getElementById("avatarPlaceholder").style.display = "none";
    } else {
        document.getElementById("avatarImg").style.display = "none";
        document.getElementById("avatarPlaceholder").style.display = "block";
    }
    refreshNotificationDot();
}

// 上传头像
async function uploadAvatar(file) {
    const { error } = await supabase.storage.from("avatars").upload(userId, file, { upsert: true });
    if (error) { alert(error.message); return; }
    const { data: { publicUrl } } = supabase.storage.from("avatars").getPublicUrl(userId);
    await supabase.from("profiles").update({ avatar_url: publicUrl }).eq("user_id", userId);
    avatarImg.src = getFreshAvatar(publicUrl);
    avatarImg.style.display = "block";
    avatarPlaceholder.style.display = "none";
    alert("头像更新成功");
}

// 批量渲染留言头像
async function renderMessageAvatars() {
    const items = document.querySelectorAll(".message-item");
    const userIds = [];
    items.forEach(el => {
        const uid = el.dataset.userId;
        if (uid && uid !== "undefined" && uid !== "null") userIds.push(uid);
    });
    if (userIds.length === 0) return;

    const { data: profiles } = await supabase
        .from("profiles")
        .select("user_id, avatar_url")
        .in("user_id", [...new Set(userIds)]); // 去重

    const avatarMap = {};
    if (profiles) profiles.forEach(p => { avatarMap[p.user_id] = p.avatar_url; });

    items.forEach(el => {
        const uid = el.dataset.userId;
        const anonymous = el.dataset.anonymous === "true";
        const box = el.querySelector(".message-avatar-box");
        const username = el.querySelector(".message-author")?.textContent || "";
        const firstChar = username.charAt(0) || "?";

        if (anonymous) {
            box.innerHTML = `<div style="width:38px;height:38px;border-radius:50%;background:#000;"></div>`;
            return;
        }
        if (uid && avatarMap[uid]) {
            box.innerHTML = `<img src="${getFreshAvatar(avatarMap[uid])}" style="width:38px;height:38px;border-radius:50%;object-fit:cover;">`;
        } else {
            box.innerHTML = `<div style="width:38px;height:38px;border-radius:50%;background:#ccc;display:flex;align-items:center;justify-content:center;color:#666;">${firstChar}</div>`;
        }
    });
}

// 登录校验
async function initAuth() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
        alert('请先登录后再访问校墙！');
        location.href = 'login.html';
        return false;
    }
    const { data: { user }, error } = await supabase.auth.getUser();
    if (error || !user) {
        alert('登录超时，请重新登录');
        await supabase.auth.signOut();
        location.href = 'login.html';
        return false;
    }
    currentUser = user;
    userId = user.id;
    currentUserEmail = user.email;
    currentUserRealName = user.user_metadata?.username || user.email.split('@')[0] || '用户';
    return true;
}

// 昵称下拉初始化
function initNicknameSelect() {
    const select = document.getElementById('nicknameSelect');
    select.innerHTML = '';
    const optionReal = document.createElement('option');
    optionReal.value = currentUserRealName;
    optionReal.textContent = currentUserRealName;
    const optionAnon = document.createElement('option');
    optionAnon.value = '匿名用户';
    optionAnon.textContent = '匿名用户';
    select.appendChild(optionReal);
    select.appendChild(optionAnon);
    select.value = currentUserRealName;
}

// 图片预览
function previewImages(input) {
    const container = document.getElementById('previewContainer');
    container.innerHTML = '';
    const files = Array.from(input.files);
    if (files.length > MAX_IMAGES) {
        alert(`最多只能上传${MAX_IMAGES}张图片！`);
        input.value = '';
        return;
    }
    for (let file of files) {
        if (!file.type.startsWith('image/') || file.size > MAX_SIZE) {
            alert(`图片格式/大小不符合要求！`);
            input.value = '';
            container.innerHTML = '';
            input.value = '';
            return;
        }
        const reader = new FileReader();
        reader.onload = function (e) {
            const img = document.createElement('img');
            img.src = e.target.result;
            img.className = 'file-preview';
            container.appendChild(img);
        };
        reader.readAsDataURL(file);
    }
}

// 上传图片
async function uploadImages(files) {
    if (!files || files.length === 0) return null;
    const urlList = [];
    const progressBar = document.getElementById('progressBar');
    const uploadProgress = document.getElementById('uploadProgress');
    uploadProgress.style.display = 'block';
    progressBar.style.width = '0%';
    try {
        for (let i = 0; i < files.length; i++) {
            const fileName = `${Date.now()}-${Math.random().toString(36).slice(2)}-${files[i].name}`;
            const { error } = await supabase.storage.from(STORAGE_BUCKET).upload(fileName, files[i]);
            if (error) throw new Error(`图片上传失败: ${error.message}`);
            const { data: urlData } = supabase.storage.from(STORAGE_BUCKET).getPublicUrl(fileName);
            urlList.push(urlData.publicUrl);
            progressBar.style.width = `${((i + 1) / files.length) * 100}%`;
        }
        return urlList;
    } catch (error) {
        alert(error.message);
        return null;
    } finally {
        uploadProgress.style.display = 'none';
    }
}

// 发布留言
async function postMessage() {
    const username = document.getElementById('nicknameSelect').value;
    const content = document.getElementById('messageContent').value.trim();
    const files = document.getElementById('messagePicFile').files;
    const submitBtn = document.getElementById('submitBtn');

    if (!content) {
        alert('留言内容不能为空！');
        return;
    }
    submitBtn.disabled = true;
    submitBtn.textContent = '发布中...';

    try {
        const picUrls = await uploadImages(Array.from(files));
        const insertData = {
            user_id: currentUser.id,
            username, content, pic_url: picUrls,
            contact_email: currentUserEmail,
            flag: 0, reply_to: null,
            created_at: new Date().toISOString()
        };
        const { data: newMsg } = await supabase.from('messages').insert([insertData]).select().single();
        await sendNotificationToAllAuditors("🔔 新留言待审核", `用户：${username}\n内容：${content.slice(0, 50)}...`, newMsg.id);

        alert('留言发布成功！审核结果将通过站内通知告知您');
        document.getElementById('messageContent').value = '';
        document.getElementById('messagePicFile').value = '';
        document.getElementById('previewContainer').innerHTML = '';
        loadMainMessages(false);
    } catch (error) {
        alert('发布失败：' + (error.message || error));
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '发布留言';
    }
}

// 跳转详情
function goToDetails(msgId) {
    location.href = `details.html?id=${msgId}`;
}

// 加载留言（核心分页+懒加载）
async function loadMainMessages(isLoadMore = false) {
    if (isLoadMore && (!hasMore || isLoadingMore)) return;
    if (isLoadMore) isLoadingMore = true;

    // 终止上一次未完成请求
    if (abortController) abortController.abort();
    abortController = new AbortController();
    const signal = abortController.signal;

    const container = document.getElementById('messageContainer');
    const loadMoreWrap = document.getElementById('loadMoreWrapper');

    // 首次加载
    if (!isLoadMore) {
        container.innerHTML = '<div class="loading">加载留言中...</div>';
        currentPage = 0;
        hasMore = true;
        if (loadMoreWrap) loadMoreWrap.remove();
    } else {
        // 滚动加载时显示加载状态
        if (!document.querySelector('.list-loading-tip')) {
            container.insertAdjacentHTML('beforeend', '<div class="loading list-loading-tip">加载更多...</div>');
        }
    }

    const from = currentPage * PAGE_SIZE;
    const to = from + PAGE_SIZE - 1;

    try {
        const { data, error, count } = await supabase
            .from('messages')
            .select('*', { count: 'exact' })
            .eq('flag', 1)
            .is('reply_to', null)
            .order('created_at', { ascending: false })
            .range(from, to);

        if (signal.aborted) return;
        if (error) throw error;

        // 判断是否还有数据
        const totalLoaded = (currentPage + 1) * PAGE_SIZE;
        if (!count || totalLoaded >= count) {
            hasMore = false;
        }

        // 移除加载提示
        const loadingTip = document.querySelector('.list-loading-tip');
        if (loadingTip) loadingTip.remove();

        if (!data || data.length === 0) {
            if (!isLoadMore) {
                container.innerHTML = '<div class="empty-message">暂无留言，快来发布第一条留言吧！</div>';
            }
            hasMore = false;
            showNoMoreTip();
            userMap = {};
            return;
        }

        data.forEach(msg => { userMap[msg.id] = msg.username; });

        let html = '';
        for (let msg of data) {
            const time = new Date(msg.created_at).toLocaleString('zh-CN');
            let imageHtml = '';
            if (msg.pic_url && msg.pic_url.length > 0) {
                imageHtml = '<div class="message-images">';
                for (let url of msg.pic_url) {
                    imageHtml += `<img src="${escapeHtml(url)}" class="message-image" onclick="window.open(this.src)">`;
                }
                imageHtml += '</div>';
            }
            html += `
            <div class="message-item" id="message-${msg.id}" data-user-id="${msg.user_id || ''}" data-anonymous="${msg.username === '匿名用户' ? 'true' : 'false'}">
                <div class="message-avatar-box"></div>
                <div style="flex:1">
                    <div class="message-header">
                        <span class="message-author">${escapeHtml(msg.username)}</span>
                        <span class="message-time">${time}</span>
                    </div>
                    <div class="message-content">${escapeHtml(msg.content).replace(/\n/g, '<br>')}</div>
                    ${imageHtml}
                    <button class="detail-btn" onclick="goToDetails('${msg.id}')">🔍 查看详情</button>
                </div>
            </div>`;
        }

        if (isLoadMore) {
            container.insertAdjacentHTML('beforeend', html);
            currentPage++;
        } else {
            container.innerHTML = html;
            currentPage++;
        }

        // 底部按钮 / 到底提示
        if (hasMore) {
            bindLoadMoreBtn();
        } else {
            showNoMoreTip();
        }

        renderMessageAvatars();
    } catch (err) {
        if (signal.aborted) return;
        if (!isLoadMore) {
            container.innerHTML = `<div class="empty-message">加载失败：${err.message}</div>`;
        }
    } finally {
        isLoadingMore = false;
    }
}

// 绑定加载更多按钮（只绑定一次）
function bindLoadMoreBtn() {
    let wrap = document.getElementById('loadMoreWrapper');
    if (wrap) return;

    const container = document.getElementById('messageContainer');
    container.insertAdjacentHTML('afterend', `
        <div id="loadMoreWrapper" style="text-align:center;margin:20px 0;">
            <button id="loadMoreBtn" class="submit-btn" style="width:auto;padding:10px 30px;">加载更多</button>
        </div>
    `);
    document.getElementById('loadMoreBtn').addEventListener('click', () => loadMainMessages(true));
}

// 显示「没有更多了」
function showNoMoreTip() {
    const wrap = document.getElementById('loadMoreWrapper');
    if (wrap) wrap.remove();

    const container = document.getElementById('messageContainer');
    if (!document.querySelector('.no-more-tip')) {
        container.insertAdjacentHTML('afterend', `
            <div class="empty-message no-more-tip" style="padding:20px 0;">— 已经到底啦，没有更多留言 —</div>
        `);
    }
}

// HTML转义防XSS
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text || '';
    return div.innerHTML;
}

// 页面初始化
window.onload = async function () {
    const loggedIn = await initAuth();
    if (!loggedIn) return;

    document.getElementById('contactEmail').value = currentUserEmail;
    initNicknameSelect();
    await loadMainMessages(false);
    await initUserExtra();

    // 退出登录
    document.getElementById('logoutBtn').onclick = async () => {
        await supabase.auth.signOut();
        alert('已退出登录');
        location.href = 'login.html';
    };

    // 头像下拉菜单
    const avatarBtn = document.getElementById('avatarBtn');
    const avatarDropdown = document.getElementById('avatarDropdown');
    avatarBtn.onclick = (e) => {
        e.stopPropagation();
        avatarDropdown.style.display = avatarDropdown.style.display === "block" ? "none" : "block";
    };
    document.addEventListener('click', (e) => {
        if (!avatarBtn.contains(e.target) && !avatarDropdown.contains(e.target)) {
            avatarDropdown.style.display = "none";
        }
    });

    // 更换头像
    document.getElementById('changeAvatar').onclick = () => {
        document.getElementById('avatarInput').click();
        avatarDropdown.style.display = "none";
    };
    document.getElementById('avatarInput').onchange = async (e) => {
        if (e.target.files[0]) await uploadAvatar(e.target.files[0]);
    };

    // 打开通知中心（传入false重置分页）
    document.getElementById('openNotifications').onclick = async () => {
        await openNotifications(false);
        avatarDropdown.style.display = "none";
    };

    // 关闭弹窗
    document.getElementById('closeModal').onclick = () => {
        document.getElementById('notificationModal').style.display = "none";
    };
    document.getElementById('notificationModal').onclick = (e) => {
        if (e.target === document.getElementById('notificationModal')) {
            document.getElementById('notificationModal').style.display = "none";
        }
    };

    // ========== 弹窗内部滚动懒加载监听 ==========
    const notifyModalBody = document.getElementById("notificationList");
    notifyModalBody.addEventListener("scroll", async () => {
        if (!notifyHasMore || notifyLoading) return;
        const scrollTop = notifyModalBody.scrollTop;
        const viewHeight = notifyModalBody.clientHeight;
        const totalHeight = notifyModalBody.scrollHeight;
        // 距离底部80px提前加载下一页通知
        if (scrollTop + viewHeight >= totalHeight - 80) {
            await openNotifications(true);
        }
    });

    // 留言列表页面滚动懒加载
    window.addEventListener('scroll', () => {
        if (isLoadingMore || !hasMore) return;
        clearTimeout(scrollTimeout);

        scrollTimeout = setTimeout(() => {
            const scrollTop = Math.max(window.pageYOffset, document.documentElement.scrollTop);
            const viewHeight = window.innerHeight;
            const docHeight = document.documentElement.scrollHeight;

            // 严谨触底判断
            if (scrollTop + viewHeight >= docHeight - SCROLL_THRESHOLD) {
                loadMainMessages(true);
            }
        }, 120);
    });
};

// 页面卸载，终止请求、清除定时器
window.addEventListener('beforeunload', () => {
    if (abortController) abortController.abort();
    if (scrollTimeout) clearTimeout(scrollTimeout);
});
    </script>
